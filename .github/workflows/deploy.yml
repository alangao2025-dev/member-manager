name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Create the D1 database on first deploy and write its real id into wrangler.json
      - name: Resolve D1 database
        if: hashFiles('migrations/*.sql') != ''
        run: |
          name=$(jq -r '.d1_databases[0].database_name' wrangler.json)
          id=$(npx wrangler d1 list --json | jq -r --arg n "$name" '.[] | select(.name==$n) | .uuid')
          if [ -z "$id" ]; then
            npx wrangler d1 create "$name"
            id=$(npx wrangler d1 list --json | jq -r --arg n "$name" '.[] | select(.name==$n) | .uuid')
          fi
          echo "D1 $name = $id"
          jq --arg id "$id" '.d1_databases[0].database_id = $id' wrangler.json > wrangler.tmp && mv wrangler.tmp wrangler.json
          npx wrangler d1 migrations apply "$name" --remote

      - run: npm run cf:build

      - run: npx wrangler deploy
